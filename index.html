<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <title>Oficina Codeverse</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header>
            <h1>Academia de Heróis</h1>
            <p>Increva-se para participar da minha oficina de HTML!</p>
        </header>


        <main>
            <section>
                <h1>Faça sua insrição!!</h1>
        <form action="#" method="get">
            <label for="nome">Nome do Herói:</label>
            <input id="nome" name="nome" type="text" />


            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" />


            <label for="idade">Idade</label>
            <input id="idade" name="idade" type="number" />


            <label for="equipe">Escolha sua equipe:</label>
            <select id="equipe" name="equipe">
                <option>Escolha sua equipe</option>
                <option>Liga Da Justiça</option>
                <option>X-Men</option>
                <option>Aves de Rapina</option>
            </select>


            <p>Qual poder você prefere?</p>


            <label class="opcao">
                <input type="radio" name="poder" value="raio-x">
                Raio-X
                </label>
            <label class="opcao">
            <input type="radio" name="poder" value="invisibilidade">
             Invisibilidade
            </label>


            <label class="opcao">
            <input type="radio" name="poder" value="voar">
            Voar
            </label>


            <br>


            <label for="descricao">Porque você quer ser um herói?</label>
            <textarea id="descricao" name="descricao" rows="4"></textarea>
            <br>
            <button type="submit">Enviar inscrição</button>


        </form>
            </section>
        </main>


        <footer>
        <p>Página desenvolvida para a prática de formulários HTML.</p>
    </footer>
    </body>
</html>
